nelmio_api_doc:
    documentation:
        info:
            title: Freedom24 Test Assignment API
            version: '1.0'
            basePath: '/api/v1.0'
        components:
            schemas:
                CurrencyEnum:
                    type: string
                    enum: [
                        'RUR', 'RUB', 'AUD', 'AZN', 'DZD', 'GBP', 'AMD', 'BHD', 'BYN', 'BOB', 'BRL', 'HUF', 'VND', 'HKD',
                        'GEL', 'DKK', 'AED', 'USD', 'EUR', 'EGP', 'INR', 'IDR', 'IRR', 'KZT', 'CAD', 'QAR', 'KGS', 'CNY',
                        'CUP', 'MDL', 'MNT', 'NGN', 'NZD', 'NOK', 'OMR', 'PLN', 'SAR', 'RON', 'XDR', 'SGD', 'TJS', 'THB',
                        'BDT', 'TRY', 'TMT', 'UZS', 'UAH', 'CZK', 'SEK', 'CHF', 'ETB', 'RSD', 'ZAR', 'KRW', 'JPY', 'MMK'
                    ]
                ErrorResponse:
                    type: object
                    properties:
                        message:
                            type: string
                            example: 'Error message'
                CurrencyResponse:
                    type: object
                    properties:
                        rate:
                            type: number
                            format: string
                            example: "1.12345"
                        diff:
                            type: number
                            format: string
                            example: "-0.01234"
                HealthResponse:
                    type: object
                    properties:
                        status:
                            type: string
                            example: 'ok'
        paths:
            '/api/v1.0/healthz':
                get:
                    summary: 'Check that the application is up'
                    tags: ['Service']
                    responses:
                        '200':
                            description: 'The application is up and handles requests'
                            content:
                                application/json:
                                    schema:
                                        $ref: '#/components/schemas/HealthResponse'
            '/api/v1.0/metrics':
                get:
                    summary: 'Get metrics'
                    description: 'Returns metrics in Prometheus text format for queues currency_daily and currency_daily_failed'
                    tags: ['Service']
                    responses:
                        '200':
                            description: 'Number of messages in each queue'
                            content:
                                text/plain:
                                    schema:
                                        type: string
                                        example: |
                                            # HELP rabbitmq_queue_messages Number of messages in the RabbitMQ queue
                                            # TYPE rabbitmq_queue_messages gauge
                                            rabbitmq_queue_messages{queue="currency_daily"} 0
                                            rabbitmq_queue_messages{queue="currency_daily_failed"} 0
                        '503':
                            description: 'RabbitMQ is unavailable'
                            content:
                                text/plain:
                                    schema:
                                        type: string
                                        example: 'Failed to receive queue metrics'
            '/api/v1.0/currency':
                get:
                    summary: 'Get the currency rate'
                    tags: ['Currency']
                    parameters:
                        - name: date
                          description: 'The date in format YYYY-MM-DD. Must be strictly after 1998-01-01 and not in the future'
                          in: query
                          required: true
                          schema:
                            type: string
                            format: date
                            example: '2026-10-15'
                        - name: from
                          description: 'The currency which you want to get from'
                          in: query
                          schema:
                            $ref: '#/components/schemas/CurrencyEnum'
                        - name: to
                          description: 'The currency which you want to get for'
                          in: query
                          required: true
                          schema:
                            $ref: '#/components/schemas/CurrencyEnum'
                    responses:
                        '200':
                            description: 'Return the currency exchange rate for a certain date'
                            content:
                                application/json:
                                    schema:
                                        $ref: '#/components/schemas/CurrencyResponse'
                        '400':
                            description: 'Invalid input parameter'
                            content:
                                application/json:
                                    schema:
                                        $ref: '#/components/schemas/ErrorResponse'
                        '500':
                            description: 'Could not find the exchange rate for a certain date'
                            content:
                                application/json:
                                    schema:
                                        $ref: '#/components/schemas/ErrorResponse'
    areas: # to filter documented areas
        path_patterns:
            - ^/api/v1.0(?!/doc$) # Accepts routes under /api/v1.0 except /api/v1.0/doc
