services:
  backend:
    container_name: backend
    build:
      context: ../../
      dockerfile: build/dev/php-fpm/Dockerfile
    volumes:
      - ../..:/var/www
    user: "www-data"
    depends_on:
      - db
      - broker
      - redis
      - worker
    networks:
      - "f24-network"

  gateway:
    container_name: gateway
    image: nginx:stable-alpine3.24
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d/
      - ../../public/bundles/:/var/www/public/bundles/
    depends_on:
      - backend
    networks:
      - "f24-network"

  db:
    container_name: db
    image: postgres:18.6-alpine
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    networks:
        - "f24-network"

  broker:
    container_name: broker
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rmqdata:/var/lib/rabbitmq
    networks:
        - "f24-network"

  redis:
    container_name: redis
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "pass"]
    networks:
        - "f24-network"

  worker:
      container_name: worker
      build:
          context: ../../
          dockerfile: build/dev/php-fpm/Dockerfile
      volumes:
          - ../..:/var/www
      user: "www-data"
      command: [ "bin/console", "app:currency:worker" ]
      restart: unless-stopped
      depends_on:
          - db
          - broker
          - redis
      networks:
          - "f24-network"

networks:
  f24-network:
    driver: bridge

volumes:
  pgdata:
  rmqdata:
